name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, análise estática e testes (PHP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: longa_testing
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: longa_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: phpredis

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, redis, intl, zip, gd, bcmath, pcntl
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Os testes de páginas Inertia precisam do manifest do Vite
      - run: npm ci && npm run build

      - name: Pest (com cobertura)
        run: |
          set -o pipefail
          composer test:coverage 2>&1 | tee pest-output.txt
        # Publica o fim do relatório no resumo do job e, em caso de falha, como anotação
      - name: Resumo dos testes
        if: always()
        run: |
          [ -f pest-output.txt ] || exit 0
          { echo '```'; tail -n 60 pest-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'FAIL|Tests:.*failed|below|Code coverage below' pest-output.txt; then
            msg=$(grep -E 'FAIL|failed|Total|below|Failed asserting|Exception' pest-output.txt | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Pest::${msg}"
          fi

  frontend:
    name: Tipos e build (TypeScript/Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
