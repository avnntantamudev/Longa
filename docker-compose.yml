# LONGA — ambiente de desenvolvimento
# Uso: cp .env.example .env && make up   (ver README.md)
name: longa

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: longa-php:dev
  # A app lê o .env diretamente do volume (não usar env_file, para o APP_KEY gerado ser visto por todos)
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    command: ["sh", "docker/php/start-app.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f storage/framework/.ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      assets:
        condition: service_completed_successfully
    restart: unless-stopped

  # Processa as filas (default, notifications, payments) via Horizon
  worker:
    <<: *php
    command: php artisan horizon
    depends_on: &after-app
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on: *after-app

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on: *after-app
    ports:
      - "${REVERB_PORT:-8081}:8080"

  # Compila os assets do frontend uma vez (se ainda não existirem) e termina
  assets:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "[ -f public/build/manifest.json ] || (npm ci && npm run build)"
    volumes:
      - ./:/var/www/html
    restart: "no"

  # Servidor Vite com hot reload (opcional): docker compose --profile dev up
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    profiles: ["dev"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-longa}
      MYSQL_USER: ${DB_USERNAME:-longa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}
      TZ: Africa/Luanda
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-63790}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
